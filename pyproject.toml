[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboray"
version = "0.1.0"
description = "Egocentric video to training-ready dataset pipeline on Ray"
requires-python = ">=3.10,<3.11"
dependencies = [
  "ray[default]==2.59.0",
  "numpy>=1.26,<2.0",
  "opencv-python-headless>=4.9",
  "PyYAML>=6.0",
  # Action understanding (stage 3) runs in the main env; the VLM client is a core dependency
  "openai>=1.40",
  # Visualization (stage 4) runs on CPU actors in the main env; matplotlib Agg renders the world view
  "matplotlib>=3.8",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "pyyaml>=6.0"]
models = [
  "torch>=2.4",
  "openai>=1.40",
  "lerobot",
]

[project.scripts]
roboray = "roboray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not gpu\""
timeout = 300
markers = [
  "gpu: requires a real GPU and real model weights",
  "slow: long running",
  "fake_fail_on: preconfigures the Ray worker fake hook (fail_on)",
]
